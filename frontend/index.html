<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpendSmart — Expense Tracker</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">💸 SpendSmart</div>
      <span class="header-sub">Personal Finance Tracker</span>
    </div>
  </header>

  <main class="app">

    <!-- SUMMARY CARDS -->
    <section class="summary">
      <div class="summary-card balance">
        <span class="summary-label">Total Balance</span>
        <span class="summary-amount" id="balance">₹0.00</span>
      </div>
      <div class="summary-card income">
        <span class="summary-label">↑ Income</span>
        <span class="summary-amount" id="income">₹0.00</span>
      </div>
      <div class="summary-card expense">
        <span class="summary-label">↓ Expenses</span>
        <span class="summary-amount" id="expense">₹0.00</span>
      </div>
    </section>

    <div class="app-grid">

      <!-- ADD TRANSACTION FORM -->
      <section class="form-card">
        <h2 class="section-title">Add Transaction</h2>

        <div class="form-group">
          <label>Description</label>
          <input type="text" id="fieldText" placeholder="e.g. Monthly Salary" maxlength="60"/>
        </div>

        <div class="form-group">
          <label>Amount (₹)</label>
          <input type="number" id="fieldAmount" placeholder="0.00" min="0" step="0.01"/>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Category</label>
            <select id="fieldCategory">
              <option value="salary">💼 Salary</option>
              <option value="freelance">💻 Freelance</option>
              <option value="food">🍔 Food</option>
              <option value="housing">🏠 Housing</option>
              <option value="transport">🚗 Transport</option>
              <option value="entertainment">🎬 Entertainment</option>
              <option value="health">💊 Health</option>
              <option value="other">📦 Other</option>
            </select>
          </div>

          <div class="form-group">
            <label>Type</label>
            <select id="fieldType">
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>
        </div>

        <button class="btn-add" id="btnAdd">+ Add Transaction</button>
        <div class="form-msg" id="formMsg"></div>
      </section>

      <!-- TRANSACTIONS LIST -->
      <section class="list-card">
        <div class="list-header">
          <h2 class="section-title">Transactions</h2>
          <div class="filter-wrap">
            <select id="filterType">
              <option value="all">All</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>
        </div>

        <div class="transactions-list" id="transactionsList">
          <div class="loading">Loading…</div>
        </div>
      </section>

    </div>

  </main>

  <footer class="footer">
    <p>SpendSmart · Built with Node.js + Express · <a href="https://github.com/praveennayak21" target="_blank">GitHub</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
